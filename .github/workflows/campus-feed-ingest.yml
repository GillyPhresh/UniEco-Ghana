name: UniEco campus feed ingest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan sources without adding anything to the review queue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unieco-campus-feed-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/deploy-main'
    # Use the existing production environment that holds the ingest secret.
    environment: "UniEco Ghana - Production / production"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research official campus updates and queue recent leads for review
        working-directory: project
        env:
          UNIECO_FEED_INGEST_TOKEN: ${{ secrets.UNIECO_FEED_INGEST_TOKEN }}
          UNIECO_RESEARCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$UNIECO_RESEARCH_DRY_RUN" = "true" ]; then
            python feed_worker/run_research.py --dry-run
          else
            python feed_worker/run_research.py
          fi
